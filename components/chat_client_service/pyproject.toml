[project]
name = "chat-client-service"
version = "0.1.0"
description = "FastAPI service exposing Telegram Bot API chat operations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chat-client-api",
    "telegram-client-impl",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "uvicorn>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_client_service"]
