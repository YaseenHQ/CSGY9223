<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Client Service — Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
    }
    #user-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.85rem;
      color: #9a9a9a;
    }
    #user-info .username { color: #54a9eb; font-weight: 500; }
    #user-info .badge {
      background: #2d6b3f;
      color: #6ee7a0;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
    }
    #user-info .badge.disconnected {
      background: #6b2d2d;
      color: #e76e6e;
    }

    /* ── Layout ── */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }

    /* ── Panels ── */
    .panel {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
    }
    .panel-header {
      padding: 0.85rem 1.25rem;
      background: #1f1f1f;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-header h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .panel-body {
      padding: 1.25rem;
    }

    /* ── Buttons ── */
    button {
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #54a9eb; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #3d99d6; }
    .btn-danger { background: #d94444; color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #c33; }
    .btn-ghost {
      background: #2a2a2a;
      color: #ccc;
    }
    .btn-ghost:hover:not(:disabled) { background: #333; }
    .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.8rem; }

    /* ── Auth Panel ── */
    #auth-section { grid-column: 1 / -1; }
    .auth-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .auth-status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #141414;
      border-radius: 8px;
      font-family: 'SF Mono', monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
    }

    /* ── Chat Panel ── */
    .message-list {
      max-height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .message-item {
      background: #141414;
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .message-item .msg-content { flex: 1; min-width: 0; }
    .message-item .msg-sender {
      font-weight: 600;
      color: #54a9eb;
      font-size: 0.8rem;
    }
    .message-item .msg-text {
      margin-top: 2px;
      word-break: break-word;
    }
    .message-item .msg-time {
      font-size: 0.7rem;
      color: #666;
      margin-top: 2px;
    }
    .message-item .msg-id {
      font-size: 0.65rem;
      color: #555;
      font-family: monospace;
    }
    .chat-input-row {
      display: flex;
      gap: 0.5rem;
    }
    .chat-input-row input, .chat-input-row select {
      flex: 1;
      background: #141414;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      color: #e0e0e0;
      font: inherit;
      outline: none;
    }
    .chat-input-row input:focus, .chat-input-row select:focus {
      border-color: #54a9eb;
    }
    .chat-input-row select { flex: 0.4; }

    /* ── Channel List ── */
    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .channel-item {
      background: #141414;
      border-radius: 8px;
      padding: 0.5rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .channel-item:hover { background: #1e1e1e; }
    .channel-item.active { border-left: 3px solid #54a9eb; }
    .channel-item .ch-name { font-weight: 500; }
    .channel-item .ch-type {
      font-size: 0.75rem;
      color: #666;
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* ── Trello Panel ── */
    .board-list, .issue-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .issue-item {
      background: #141414;
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .issue-item .issue-title { flex: 1; }
    .issue-status {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }
    .issue-status.to_do { background: #3a3a1a; color: #e8d44d; }
    .issue-status.in_progress { background: #1a2e3a; color: #4dc8e8; }
    .issue-status.completed { background: #1a3a1a; color: #4de84d; }
    .issue-actions { display: flex; gap: 0.4rem; margin-left: 0.5rem; }

    .trello-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .trello-form input, .trello-form select, .trello-form textarea {
      background: #141414;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      color: #e0e0e0;
      font: inherit;
      outline: none;
    }
    .trello-form input:focus, .trello-form textarea:focus {
      border-color: #54a9eb;
    }
    .trello-form textarea { resize: vertical; min-height: 60px; }

    /* ── AI Panel ── */
    .ai-messages {
      max-height: 350px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .ai-msg {
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      max-width: 85%;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .ai-msg.user {
      background: #1a3a5a;
      color: #b8dcf5;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .ai-msg.bot {
      background: #2a2a2a;
      color: #e0e0e0;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .ai-msg.error {
      background: #3a1a1a;
      color: #e76e6e;
    }
    .ai-input-row {
      display: flex;
      gap: 0.5rem;
    }
    .ai-input-row input {
      flex: 1;
      background: #141414;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      color: #e0e0e0;
      font: inherit;
      outline: none;
    }
    .ai-input-row input:focus { border-color: #54a9eb; }

    /* ── Empty states ── */
    .empty-state {
      text-align: center;
      color: #555;
      padding: 2rem;
      font-size: 0.85rem;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #444;
      border-top-color: #54a9eb;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-left: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .toast {
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      animation: fadeIn 0.2s ease;
      max-width: 350px;
    }
    .toast.success { background: #1a3a1a; color: #6ee7a0; border: 1px solid #2d6b3f; }
    .toast.error { background: #3a1a1a; color: #e76e6e; border: 1px solid #6b2d2d; }
    .toast.info { background: #1a2a3a; color: #6eb8e7; border: 1px solid #2d4f6b; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <h1>Chat Client Service</h1>
  <div id="user-info">
    <span class="badge disconnected" id="status-badge">Not Connected</span>
  </div>
</header>

<div class="container">

  <!-- ── Auth Section ── -->
  <section id="auth-section" class="panel" style="margin-bottom:1.5rem;">
    <div class="panel-header">
      <h2>Authentication</h2>
    </div>
    <div class="panel-body">
      <div class="auth-actions">
        <button class="btn-primary" id="btn-create-session">Create Session</button>
        <button class="btn-primary" id="btn-login" disabled>Open Login</button>
        <button class="btn-ghost" id="btn-check-status" disabled>Check Status</button>
        <button class="btn-ghost" id="btn-whoami" disabled>Who Am I</button>
        <button class="btn-danger btn-sm" id="btn-logout" disabled>Logout</button>
      </div>
      <div class="auth-status" id="auth-log">Ready. Click "Create Session" to begin.</div>
    </div>
  </section>

  <div class="grid">

    <!-- ── Chat Panel ── -->
    <div class="panel">
      <div class="panel-header">
        <h2>Chat</h2>
        <button class="btn-ghost btn-sm" id="btn-refresh-messages" disabled>Refresh</button>
      </div>
      <div class="panel-body">
        <div class="message-list" id="message-list">
          <div class="empty-state">Log in to view messages</div>
        </div>
        <div class="chat-input-row">
          <select id="chat-channel" disabled>
            <option value="me">me (self)</option>
          </select>
          <input type="text" id="chat-input" placeholder="Type a message..." disabled>
          <button class="btn-primary" id="btn-send" disabled>Send</button>
        </div>
      </div>
    </div>

    <!-- ── Channels Panel ── -->
    <div class="panel">
      <div class="panel-header">
        <h2>Channels</h2>
        <button class="btn-ghost btn-sm" id="btn-refresh-channels" disabled>Refresh</button>
      </div>
      <div class="panel-body">
        <div class="channel-list" id="channel-list">
          <div class="empty-state">Log in to view channels</div>
        </div>
      </div>
    </div>

    <!-- ── AI Assistant Panel ── -->
    <div class="panel">
      <div class="panel-header">
        <h2>AI Assistant</h2>
        <button class="btn-ghost btn-sm" id="btn-clear-ai">Clear</button>
      </div>
      <div class="panel-body">
        <div class="ai-messages" id="ai-messages">
          <div class="empty-state">Send a message to chat with the AI assistant via Telegram</div>
        </div>
        <div class="ai-input-row">
          <input type="text" id="ai-input" placeholder="Ask the assistant anything..." disabled>
          <button class="btn-primary" id="btn-ai-send" disabled>Send</button>
        </div>
      </div>
    </div>

    <!-- ── Trello Panel ── -->
    <div class="panel">
      <div class="panel-header">
        <h2>Trello Issue Tracker</h2>
        <button class="btn-ghost btn-sm" id="btn-refresh-issues" disabled>Refresh</button>
      </div>
      <div class="panel-body">
        <div class="issue-list" id="issue-list">
          <div class="empty-state">Log in to view Trello issues</div>
        </div>
        <div class="trello-form" id="create-issue-form" style="display:none;">
          <input type="text" id="issue-title" placeholder="Issue title">
          <textarea id="issue-desc" placeholder="Description (optional)"></textarea>
          <select id="issue-status">
            <option value="to_do">To Do</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
          <div style="display:flex;gap:0.5rem;">
            <button class="btn-primary btn-sm" id="btn-create-issue">Create Issue</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="toast-container"></div>

<script>
const API = window.location.origin;
let sessionId = null;
let loginConfig = null;
let _aiPollTimer = null;

function maskId(id) { return id ? id.slice(0, 6) + '...' : 'n/a'; }

/* ── Helpers ── */
function headers() {
  const h = { 'Content-Type': 'application/json' };
  if (sessionId) h['X-Session-ID'] = sessionId;
  return h;
}

async function api(method, path, body) {
  const opts = { method, headers: headers(), credentials: 'same-origin' };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (!r.ok) {
    const err = await r.json().catch(() => ({ detail: r.statusText }));
    throw new Error(err.detail || r.statusText);
  }
  if (r.status === 204) return null;
  return r.json();
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function authLog(msg) {
  const log = document.getElementById('auth-log');
  log.textContent += '\n' + msg;
  log.scrollTop = log.scrollHeight;
}

function setAuthed(username) {
  const badge = document.getElementById('status-badge');
  const info = document.getElementById('user-info');
  badge.className = 'badge';
  badge.textContent = 'Connected';
  if (username) {
    const userSpan = document.createElement('span');
    userSpan.className = 'username';
    userSpan.textContent = '@' + username;
    info.insertBefore(userSpan, info.firstChild);
  }
  const interactiveIds = [
    'btn-login', 'btn-check-status', 'btn-whoami', 'btn-logout',
    'btn-refresh-messages', 'btn-send', 'chat-input', 'chat-channel',
    'btn-refresh-channels', 'btn-ai-send', 'ai-input',
    'btn-refresh-issues', 'btn-create-issue',
    'issue-title', 'issue-desc', 'issue-status',
  ];
  interactiveIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = false;
  });
  document.getElementById('btn-create-session').disabled = true;
  document.getElementById('create-issue-form').style.display = 'flex';
}

function setLoading(buttonId, loading) {
  const btn = document.getElementById(buttonId);
  if (!btn) return;
  if (loading) {
    btn.disabled = true;
    btn.dataset.origText = btn.textContent;
    btn.innerHTML = btn.textContent + '<span class="spinner"></span>';
  } else {
    btn.disabled = false;
    btn.textContent = btn.dataset.origText || btn.textContent;
  }
}

/* ── Auth ── */

document.getElementById('btn-create-session').addEventListener('click', async () => {
  setLoading('btn-create-session', true);
  try {
    const data = await api('POST', '/auth/sessions');
    sessionId = data.session_id;
    localStorage.setItem('demo_session_id', sessionId);
    authLog(`Session created: ${maskId(data.session_id)}`);

    loginConfig = await api('GET', `/auth/login/config?session_id=${sessionId}`);
    authLog('Telegram login ready. Click "Open Login" below.');

    document.getElementById('btn-login').disabled = false;
    document.getElementById('btn-check-status').disabled = false;
    document.getElementById('btn-create-session').disabled = true;
    toast('Click "Open Login" to authenticate', 'success');
  } catch (e) {
    authLog(`Error: ${e.message}`);
    toast(e.message, 'error');
    setLoading('btn-create-session', false);
  }
});

document.getElementById('btn-login').addEventListener('click', () => {
  if (!loginConfig) {
    authLog('Click "Create Session" first.');
    return;
  }
  localStorage.setItem('demo_session_id', sessionId);
  localStorage.setItem('demo_login_nonce', loginConfig.nonce);
  const params = new URLSearchParams({
    bot_id: loginConfig.client_id,
    origin: loginConfig.origin,
    embed: '0',
    request_access: 'write',
    return_to: window.location.origin + '/demo',
  });
  window.location.href = 'https://oauth.telegram.org/auth?' + params.toString();
});

document.getElementById('btn-check-status').addEventListener('click', async () => {
  if (!sessionId) { authLog('No session. Click "Create Session" first.'); return; }
  setLoading('btn-check-status', true);
  try {
    const s = await api('GET', `/auth/sessions/${sessionId}`);
    authLog(`Status: authenticated=${s.authenticated}, user=${s.username || s.name || s.telegram_id || 'n/a'}`);
    if (s.authenticated) {
      setAuthed(s.username);
      loadChannels();
      loadMessages('me');
    }
  } catch (e) {
    authLog(`Error: ${e.message}`);
  } finally {
    setLoading('btn-check-status', false);
  }
});

document.getElementById('btn-whoami').addEventListener('click', async () => {
  try {
    const me = await api('GET', '/auth/me');
    authLog(`Identity: telegram_id=${me.telegram_id}, username=${me.username}, name=${me.name}`);
    toast(`Logged in as ${me.name || me.username}`, 'info');
  } catch (e) {
    authLog(`Error: ${e.message}`);
    toast(e.message, 'error');
  }
});

document.getElementById('btn-logout').addEventListener('click', async () => {
  try {
    await api('DELETE', `/auth/sessions/${sessionId}`);
    localStorage.removeItem('demo_session_id');
    localStorage.removeItem('demo_login_nonce');
    authLog('Session deleted. Logged out.');
    toast('Logged out', 'info');
    location.reload();
  } catch (e) {
    authLog(`Error: ${e.message}`);
  }
});

/* ── Messages ── */
async function loadMessages(channelId) {
  const list = document.getElementById('message-list');
  try {
    const msgs = await api('GET', `/chat/messages?channel_id=${encodeURIComponent(channelId)}&limit=20`);
    if (!msgs.length) {
      list.innerHTML = '<div class="empty-state">No messages yet</div>';
      return;
    }
    list.innerHTML = '';
    msgs.forEach(m => {
      const item = document.createElement('div');
      item.className = 'message-item';

      const content = document.createElement('div');
      content.className = 'msg-content';

      const sender = document.createElement('div');
      sender.className = 'msg-sender';
      sender.textContent = m.sender;

      const text = document.createElement('div');
      text.className = 'msg-text';
      text.textContent = m.text;

      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = m.timestamp;

      const msgId = document.createElement('div');
      msgId.className = 'msg-id';
      msgId.textContent = m.id;

      content.append(sender, text, time, msgId);

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-danger btn-sm';
      delBtn.textContent = 'Del';
      delBtn.addEventListener('click', () => deleteMessage(m.id));

      item.append(content, delBtn);
      list.appendChild(item);
    });
    list.scrollTop = list.scrollHeight;
  } catch (e) {
    list.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = e.message;
    list.appendChild(empty);
  }
}

document.getElementById('btn-refresh-messages').addEventListener('click', () => {
  const ch = document.getElementById('chat-channel').value;
  loadMessages(ch);
});

document.getElementById('btn-send').addEventListener('click', sendMessage);
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const channel = document.getElementById('chat-channel').value;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    await api('POST', '/chat/messages', { channel_id: channel, text });
    toast('Message sent', 'success');
    loadMessages(channel);
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function deleteMessage(id) {
  try {
    await api('DELETE', `/chat/messages/${id}`);
    toast('Message deleted', 'success');
    const ch = document.getElementById('chat-channel').value;
    loadMessages(ch);
  } catch (e) {
    toast(e.message, 'error');
  }
}

/* ── Channels ── */
async function loadChannels() {
  const list = document.getElementById('channel-list');
  const select = document.getElementById('chat-channel');
  try {
    const channels = await api('GET', '/chat/channels');
    if (!channels.length) {
      list.innerHTML = '<div class="empty-state">No channels found</div>';
      return;
    }
    list.innerHTML = '';
    channels.forEach(c => {
      const item = document.createElement('div');
      item.className = 'channel-item';
      item.addEventListener('click', () => {
        document.getElementById('chat-channel').value = c.id;
        loadMessages(c.id);
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
      });

      const name = document.createElement('span');
      name.className = 'ch-name';
      name.textContent = c.name;

      const type = document.createElement('span');
      type.className = 'ch-type';
      type.textContent = c.channel_type;

      item.append(name, type);
      list.appendChild(item);
    });
    select.innerHTML = '<option value="me">me (self)</option>';
    channels.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      select.appendChild(opt);
    });
  } catch (e) {
    list.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = e.message;
    list.appendChild(empty);
  }
}

document.getElementById('btn-refresh-channels').addEventListener('click', loadChannels);

/* ── AI Assistant ── */
document.getElementById('btn-ai-send').addEventListener('click', sendAiMessage);
document.getElementById('ai-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendAiMessage();
});

function appendAiMsg(text, cls) {
  const container = document.getElementById('ai-messages');
  const div = document.createElement('div');
  div.className = `ai-msg ${cls}`;
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function sendAiMessage() {
  const input = document.getElementById('ai-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  appendAiMsg(text, 'user');

  try {
    const me = await api('GET', '/auth/me');
    const telegramId = String(me.telegram_id || '').trim();
    if (!telegramId) {
      throw new Error('Authenticated session has no Telegram identity.');
    }

    const numericTelegramId = Number(telegramId);
    if (!Number.isFinite(numericTelegramId)) {
      throw new Error('Telegram identity is not numeric.');
    }

    const messageId = Date.now();
    const sentAfterIso = new Date((Math.floor(messageId / 1000) - 1) * 1000).toISOString();
    const firstName = String(me.name || me.username || 'Telegram User').trim() || 'Telegram User';

    const update = {
      update_id: messageId,
      message: {
        message_id: messageId,
        date: Math.floor(messageId / 1000),
        text,
        chat: {
          id: numericTelegramId,
          type: 'private',
          first_name: firstName,
        },
        from: {
          id: numericTelegramId,
          is_bot: false,
          first_name: firstName,
          username: me.username || undefined,
        },
      },
    };

    await api('POST', '/telegram/webhook', update);
    toast('Message sent to assistant', 'info');

    if (_aiPollTimer) clearInterval(_aiPollTimer);
    let attempts = 0;
    const maxAttempts = 20;
    _aiPollTimer = setInterval(async () => {
      attempts++;
      try {
        const msgs = await api('GET', '/chat/messages?channel_id=me&limit=10');
        const botReply = msgs.find(m =>
          m.sender !== telegramId &&
          m.timestamp >= sentAfterIso
        );
        if (botReply) {
          clearInterval(_aiPollTimer);
          _aiPollTimer = null;
          appendAiMsg(botReply.text, 'bot');
        } else if (attempts >= maxAttempts) {
          clearInterval(_aiPollTimer);
          _aiPollTimer = null;
          appendAiMsg('No reply received. The AI assistant may not be configured or may have hit a rate limit.', 'error');
        }
      } catch (_) {}
    }, 2000);
  } catch (e) {
    appendAiMsg(e.message, 'error');
  }
}

document.getElementById('btn-clear-ai').addEventListener('click', () => {
  document.getElementById('ai-messages').innerHTML =
    '<div class="empty-state">Send a message to chat with the AI assistant via Telegram</div>';
});

/* ── Trello ── */
function loadIssues() {
  const list = document.getElementById('issue-list');
  list.innerHTML = '<div class="empty-state">Trello integration works through the AI Assistant panel. Try asking "Show me my Trello boards" or "Create an issue called Test on my board".</div>';
}

document.getElementById('btn-refresh-issues').addEventListener('click', loadIssues);

document.getElementById('btn-create-issue').addEventListener('click', async () => {
  const title = document.getElementById('issue-title').value.trim();
  if (!title) { toast('Title is required', 'error'); return; }
  const desc = document.getElementById('issue-desc').value.trim();
  const issueStatus = document.getElementById('issue-status').value;
  const prompt = `Create a new issue titled "${title}"${desc ? ` with description "${desc}"` : ''} with status ${issueStatus.replace('_', ' ')} on my board`;

  const input = document.getElementById('ai-input');
  input.value = prompt;
  sendAiMessage();
  document.getElementById('issue-title').value = '';
  document.getElementById('issue-desc').value = '';
  toast('Creating issue via AI...', 'info');
});

/* ── Handle #tgAuthResult on page load (redirect fallback) ── */
async function handleAuthRedirect() {
  const fragment = new URLSearchParams(window.location.hash.slice(1));
  const authResult = fragment.get('tgAuthResult');
  if (!authResult) return;

  const savedSessionId = localStorage.getItem('demo_session_id');
  const savedNonce = localStorage.getItem('demo_login_nonce');
  if (!savedSessionId) {
    authLog('Auth redirect received but no saved session. Please create a new session.');
    return;
  }

  sessionId = savedSessionId;
  authLog('Completing login from redirect...');
  window.history.replaceState(null, '', '/demo');

  try {
    await api('POST', '/auth/telegram-login', {
      auth_result: authResult,
      state: savedNonce,
      session_id: sessionId,
    });
    const s = await api('GET', `/auth/sessions/${sessionId}`);
    if (s.authenticated) {
      authLog(`Authenticated as: ${s.name || s.username || s.telegram_id}`);
      setAuthed(s.username);
      toast('Logged in!', 'success');
      loadChannels();
      loadMessages('me');
    } else {
      authLog('Login completed but session not authenticated. Try again.');
    }
  } catch (e) {
    authLog(`Login error: ${e.message}`);
    toast(e.message, 'error');
  }
  localStorage.removeItem('demo_login_nonce');
}

/* ── Restore session on page load ── */
async function restoreSession() {
  const saved = localStorage.getItem('demo_session_id');
  if (!saved) return;
  try {
    const s = await api('GET', `/auth/sessions/${saved}`);
    if (s.authenticated) {
      sessionId = saved;
      authLog(`Session restored: ${maskId(saved)}`);
      authLog(`Authenticated as: ${s.name || s.username || s.telegram_id}`);
      setAuthed(s.username);
      loadChannels();
      loadMessages('me');
    } else {
      localStorage.removeItem('demo_session_id');
    }
  } catch (_) {
    localStorage.removeItem('demo_session_id');
  }
}

/* ── postMessage listener for popup auth completion ── */
window.addEventListener('message', async (event) => {
  if (event.origin !== window.location.origin) return;
  if (!event.data || event.data.type !== 'telegram-auth-complete') return;
  if (!sessionId) return;
  try {
    const s = await api('GET', `/auth/sessions/${sessionId}`);
    if (s.authenticated) {
      authLog(`Authenticated as: ${s.name || s.username || s.telegram_id}`);
      setAuthed(s.username);
      toast('Logged in!', 'success');
      loadChannels();
      loadMessages('me');
    }
  } catch (_) {}
});

/* ── Init ── */
(async () => {
  if (window.location.hash.includes('tgAuthResult')) {
    await handleAuthRedirect();
  } else {
    await restoreSession();
  }
})();
</script>
