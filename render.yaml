services:
  - type: web
    name: chat-client-service
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements-render.txt
    startCommand: python -m uvicorn chat_client_service.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SESSION_NAME
        value: telegram_session
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: SERVICE_BASE_URL
        sync: false
